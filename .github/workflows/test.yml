on:
    pull_request:
    push:
        branches: [main]
name: Run Tests

jobs:
    typescript-check:
        name: TypeScript Check
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: "22"
            - name: Install Dependencies
              run: npm install
            - name: Run TypeScript Check
              run: npm run type-check

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: "22"
            - name: Install Dependencies
              run: npm install
            - name: Run Unit Tests
              run: npm run test BaseClient.test.ts stringTypes.test.ts swaggerSchema.test.ts generator/schemaTypes.test.ts

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: "22"
            - name: Install Dependencies
              run: npm install
            - name: Run E2E Tests
              run: npm run test e2e.test.ts
              env:
                  VANTAGE_API_TOKEN: ${{ secrets.VANTAGE_API_TOKEN }}
                  VANTAGE_WORKSPACE_TOKEN: ${{ secrets.VANTAGE_WORKSPACE_TOKEN }}

    dry-build:
        name: Dry Build
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: "22"
            - name: Install Dependencies
              run: npm install
            - run: npm run build

    generated-files-up-to-date:
        name: Generated files up to date
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              id: changes
              with:
                  filters: |
                      autogen:
                          - openapi.json
                          - generate.ts
                          - fetchSpec.ts
                          - 'generator/**'
                          - clientAutogen.ts
                          - swaggerSchema.d.ts
                          - providers.ts
                          - constants.ts
            - name: Setup Node.js
              if: steps.changes.outputs.autogen == 'true'
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: "22"
            - name: Install Dependencies
              if: steps.changes.outputs.autogen == 'true'
              run: npm install
            - name: Check generated files against the committed spec
              if: steps.changes.outputs.autogen == 'true'
              run: |
                npm run generate
                git diff --exit-code -- swaggerSchema.d.ts clientAutogen.ts providers.ts constants.ts
